name: Deploy frontend

on:
  push:
    branches: [master, main]

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 217.76.49.201 >> ~/.ssh/known_hosts

      - name: Sync and rebuild
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            ./ root@217.76.49.201:/opt/apps/datasets/frontend/
          ssh root@217.76.49.201 'cd /opt/apps/datasets && docker compose up -d --build frontend'
